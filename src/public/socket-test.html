<!DOCTYPE html>
<html>
<head>
  <title>Socket Test</title>
</head>
<body>

<script src="http://localhost:3000/socket.io/socket.io.js"></script>

<script>
  const socket = io("http://localhost:3000");

  socket.on("connect", () => {
    console.log("Connected:", socket.id);
    socket.emit("joinBoard", "123");
  });
</script>
<script>
socket.on("card:created", data => console.log("NEW CARD", data));
socket.on("card:updated", data => console.log("UPDATED", data));
socket.on("card:deleted", data => console.log("DELETED", data));
socket.on("member:added", data => console.log("MEMBER", data));
socket.on("board:updated", data => console.log("BOARD", data));
</script>
</body>
</html>
